<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dziękujemy — Życie na Twoich warunkach</title><link rel="stylesheet" href="/style.css"></head><body><main class="statement" style="margin:12vh auto;max-width:900px"><p class="eyebrow">PŁATNOŚĆ ZAKOŃCZONA</p><h1 style="font-family:Manrope;font-size:clamp(48px,7vw,90px);letter-spacing:-.06em">Dziękujemy.<br><em>To dopiero początek.</em></h1><p style="color:#aaa;line-height:1.7">Jeżeli płatność została potwierdzona, linki do Twoich e-booków pojawią się poniżej. Zachowaj tę stronę do pobrania plików.</p><div id="downloads" style="margin-top:35px"></div><a class="btn btn-primary" href="/" style="margin-top:30px">Wróć na stronę ↗</a></main><script>const p=new URLSearchParams(location.search),s=p.get("session_id");fetch("/api/order/"+encodeURIComponent(s)).then(r=>r.json()).then(d=>{document.getElementById("downloads").innerHTML=d.downloads?.map(x=>`<a class="btn btn-primary" style="margin:8px 8px 8px 0" href="${x.url}">Pobierz ${x.title} ↓</a>`).join("")||"<p style='color:#888'>Płatność jest jeszcze w trakcie potwierdzania. Odśwież stronę za chwilę.</p>"}).catch(()=>{});</script></body></html>
